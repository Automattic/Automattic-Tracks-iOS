# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

agents:
  queue: mac

env:
  IMAGE_ID: $IMAGE_ID

# This is the default pipeline – it will build and test the app
steps:
  ######################
  # Build and Test iOS
  ######################
  # Temporary: drop RBENV_VERSION once .ruby-version is 3.4.13 (AINFRA-3834); the Linux agents lack it until AINFRA-3889/3890/3891.
  - label: "🧪 Build and Test iOS"
    key: test_ios
    command: |
      export RBENV_VERSION=3.4.13
      install_gems
      echo "--- :swift: Restoring Swift Package Manager cache"
      restore_swiftpm_cache --package-resolved TracksDemo/TracksDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved --artifacts .build/derived-data/SourcePackages
      bundle exec fastlane ios test clean:true
      echo "--- :swift: Saving Swift Package Manager cache"
      save_swiftpm_cache --package-resolved TracksDemo/TracksDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved --artifacts .build/derived-data/SourcePackages
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths: .build/logs/*.log

  - label: "🧪 ExPlat Thread Sanitizer"
    key: test_explat_tsan
    command: |
      export RBENV_VERSION=3.4.13
      install_gems
      echo "--- :swift: Restoring Swift Package Manager cache"
      restore_swiftpm_cache --package-resolved TracksDemo/TracksDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved --artifacts .build/derived-data/SourcePackages
      bundle exec fastlane ios test_explat_concurrency_tsan clean:true
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths: .build/logs/*.log

  ######################
  # Build and Test macOS
  ######################
  - label: "🧪 Build and Test macOS"
    key: test_macos
    command: |
      export RBENV_VERSION=3.4.13
      install_gems
      echo "--- :swift: Restoring Swift Package Manager cache"
      restore_swiftpm_cache --package-resolved TracksDemo/TracksDemo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved --artifacts .build/derived-data/SourcePackages
      bundle exec fastlane mac test clean:true
    plugins: [$CI_TOOLKIT_PLUGIN]
    artifact_paths: .build/logs/*.log

  - label: ":swift: SwiftLint"
    command: swiftlint
    agents:
      queue: linter
